<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
<meta charset="UTF-8">
<title>社員テキスト一括登録</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <script th:src="@{/js/app.js}" src="/js/app.js" defer></script>
</head>
<body>

<header>
    <div>フリマ社内システム　管理者コンソール</div>
    <div><a th:href="@{/logout}">ログアウト</a></div>

<nav>

<main>

    <p>1行に1人ずつ、カンマ区切りで入力してください。</p>
    <pre>user_id,name,email,role,department,password
26080,山田太郎,yamada@example.com,0,営業部,
佐藤花子,sato@example.com,1,開発部,</pre>

    <form th:action="@{/admin/users/text}" method="post">

        <button type="submit">テキスト登録</button>
    </form>
</main>

</body>
</html>
