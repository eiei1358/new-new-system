<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
<meta charset="UTF-8">
<title>メッセージ削除</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <script th:src="@{/js/app.js}" src="/js/app.js" defer></script>
</head>
<body>

<header>
    フリマ社内システム　管理者コンソール
    <a th:href="@{/logout}">ログアウト</a>
</header>

<nav>
    <h2>管理メニュー</h2>
    <ul>
        <li><a th:href="@{/admin/users}">社員情報管理</a></li>
        <li><a th:href="@{/auth/categories}">カテゴリ管理</a></li>
        <li><a th:href="@{/auth/search-keys}">検索キー管理</a></li>
        <li><a th:href="@{/auth/watch}">不適切コンテンツ監視</a></li>
        <li><a th:href="@{/auth/ng-keywords}">NGキーワード登録</a></li>
        <li><a th:href="@{/auth/items/delete}">物品削除</a></li>
        <li><a th:href="@{/auth/messages/delete}">メッセージ削除</a></li>
        <li><a th:href="@{/auth/reports}">通報確認</a></li>
        <li><a th:href="@{/auth/stats}">統計情報閲覧</a></li>
    </ul>
</nav>

<main>
    <h1>メッセージ削除</h1>

    <p th:if="${message}" th:text="${message}"></p>
    <p th:if="${error}" th:text="${error}"></p>

    <p th:if="${messages == null or #lists.isEmpty(messages)}">メッセージは登録されていません。</p>

    <table border="1" th:if="${messages != null and !#lists.isEmpty(messages)}">
        <tr>
            <th>ID</th>
            <th>商品</th>
            <th>送信者</th>
            <th>受信者</th>
            <th>内容</th>
            <th>作成日時</th>
            <th>操作</th>
        </tr>
        <tr th:each="message : ${messages}">
            <td th:text="${message['messageId']}">1</td>
            <td th:text="${message['itemName']}">商品</td>
            <td th:text="${message['senderName']}">送信者</td>
            <td th:text="${message['receiverName']}">受信者</td>
            <td th:text="${message['content']}">内容</td>
            <td th:text="${message['createdAt']}">日時</td>
            <td>
                <form th:action="@{/auth/messages/delete/{id}(id=${message['messageId']})}" method="post">
                    <button type="submit" onclick="return confirm('このメッセージを削除しますか？');">削除</button>
                </form>
            </td>
        </tr>
    </table>
</main>

</body>
</html>
