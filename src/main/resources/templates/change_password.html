<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>パスワード変更</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <script th:src="@{/js/app.js}" src="/js/app.js" defer></script>
</head>
<body>

<h1>パスワード変更</h1>

<p>仮パスワードでログインした場合、または3か月以上パスワードを変更していない場合は、ここで新しいパスワードを設定してください。</p>

<p th:if="${error}" th:text="${error}"></p>

<form action="/change-password" th:action="@{/change-password}" method="post">
    <p>
        <label>新しいパスワード</label>
        <input type="password" name="newPassword" required>
    </p>
    <p>
        <label>確認用パスワード</label>
        <input type="password" name="confirmPassword" required>
    </p>
    <button type="submit">変更する</button>
</form>

<p><a href="/logout" th:href="@{/logout}">ログアウト</a></p>

</body>
</html>
