<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>管理者メニュー</title>
<style>
body{
    margin:0;
}

header{
    display:flex;
    justify-content:space-between;
    padding:15px;
    background:#f5f5f5;
}

.main{
    display:flex;
    align-items:flex-start;
}

nav{
    width:220px;
    padding:20px;
    background:#f0f0f0;
}

.content{
    flex:1;
    padding:20px;
}

table{
    border-collapse:collapse;
}

th,td{
    padding:6px 10px;
}
</style>

    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <script th:src="@{/js/app.js}" src="/js/app.js" defer></script>
</head>
<body>

	<body>

	<header>
	    <div>
	        フリマ社内システム　管理者コンソール
	    </div>

	    <div>
	        前回ログイン：--
	        山口 管理者 さん
	        <a href="/logout">ログアウト</a>
	    </div>
	</header>

	<div class="main">

	    <nav>
	        <h2>管理メニュー</h2>

	        <ul>
	            <li><a href="/admin/users">社員情報管理</a></li>
	            <li><a href="/auth/categories">カテゴリ管理</a></li>
	            <li><a href="/auth/search-keys">検索キー管理</a></li>
	            <li><a href="/auth/watch">不適切コンテンツ監視</a></li>
	            <li><a href="/auth/ng-keywords">NGキーワード登録</a></li>
	            <li><a href="/auth/items/delete">物品削除</a></li>
	            <li><a href="/auth/messages/delete">メッセージ削除</a></li>
	            <li><a href="/auth/reports">通報確認</a></li>
            <li><a href="/auth/reports">通報確認</a></li>
        <li><a href="/auth/stats">統計情報閲覧</a></li>
	        </ul>
	    </nav>

	    <div class="content">

	        <h2>社員情報一覧</h2>

	        <table border="1">
	            <tr>
	                <th>ID</th>
	                <th>氏名</th>
	                <th>メール</th>
	                <th>権限</th>
	                <th>部署</th>
	                <th>状態</th>
	            </tr>

	            <tr th:each="user : ${users}">
	                <td th:text="${user.userId}"></td>
	                <td th:text="${user.name}"></td>
	                <td th:text="${user.email}"></td>
	                <td th:text="${user.role}"></td>
	                <td th:text="${user.department}"></td>
	                <td th:text="${user.status}"></td>
	            </tr>
	        </table>

	    </div>

	</div>

	</body>

</body>
</html>
