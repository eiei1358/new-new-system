<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>パスワードリセット</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <script th:src="@{/js/app.js}" src="/js/app.js" defer></script>
</head>
<body>

<h1>パスワードリセット</h1>

<p>登録済みのメールアドレスを入力してください。仮パスワードを発行します。</p>

<p th:if="${error}" th:text="${error}"></p>
<p th:if="${message}" th:text="${message}"></p>
<p th:if="${tempPassword}">仮パスワード：<strong th:text="${tempPassword}">TEMP</strong></p>

<form action="/forgot-password/reset" th:action="@{/forgot-password/reset}" method="post">
    <p>
        <label>メールアドレス</label>
        <input type="email" name="email" required>
    </p>
    <button type="submit">仮パスワードを発行する</button>
</form>

<p><a href="/login" th:href="@{/login}">ログイン画面へ戻る</a></p>

</body>
</html>
