
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>ログイン｜フリマ社内システム</title>

	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: #f3f5f8;
			font-family:
				"Segoe UI",
				"Hiragino Kaku Gothic ProN",
				"Yu Gothic",
				Meiryo,
				sans-serif;
			color: #1f2733;
		}

		.login-card {
			width: 360px;
			max-width: 92vw;
			padding: 28px 28px 24px;
			background-color: #ffffff;
			border: 1px solid #dfe3eb;
			border-radius: 12px;
			box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
		}

		.brand {
			margin-bottom: 4px;
			text-align: center;
			font-size: 18px;
			font-weight: 700;
			color: #1f6feb;
		}

		.title {
			margin: 0 0 20px;
			text-align: center;
			font-size: 22px;
			font-weight: 700;
		}

		.error {
			margin-bottom: 16px;
			padding: 9px 12px;
			background-color: #ffeef0;
			border: 1px solid #f5c2c7;
			border-radius: 8px;
			color: #d1242f;
			font-size: 13px;
		}

		.field {
			margin-bottom: 14px;
		}

		.field label {
			display: block;
			margin-bottom: 5px;
			font-size: 13px;
			color: #4b5563;
		}

		.field input {
			width: 100%;
			height: 40px;
			padding: 0 12px;
			border: 1px solid #cdd4df;
			border-radius: 8px;
			font-size: 14px;
			outline: none;
		}

		.field input:focus {
			border-color: #1f6feb;
			box-shadow: 0 0 0 2px rgba(31, 111, 235, 0.12);
		}

		.btn-login {
			width: 100%;
			height: 42px;
			margin-top: 6px;
			background-color: #1f6feb;
			border: none;
			border-radius: 8px;
			color: #ffffff;
			font-size: 15px;
			font-weight: 600;
			cursor: pointer;
		}

		.btn-login:hover {
			background-color: #1858c4;
		}

		.btn-login:active {
			transform: translateY(1px);
		}
	</style>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <script th:src="@{/js/app.js}" src="/js/app.js" defer></script>
</head>

<body>

	<form
		class="login-card"
		th:action="@{/login}"
		method="post">

		<div class="brand">フリマ社内システム</div>

		<h1 class="title">ログイン</h1>

		<!-- Controllerからerrorが渡された場合に表示 -->
		<div
			class="error"
			th:if="${error != null}"
			th:text="${error}"
			role="alert"
			aria-live="polite">
			メールアドレスまたはパスワードが違います。
		</div>

		<div class="field">
			<label for="email">メールアドレス</label>

			<input
				type="email"
				id="email"
				name="email"
				th:value="${email}"
				placeholder="example@company.co.jp"
				autocomplete="email"
				required
				autofocus>
		</div>

		<div class="field">
			<label for="password">パスワード</label>

			<input
				type="password"
				id="password"
				name="password"
				placeholder="パスワード"
				autocomplete="current-password"
				required>
		</div>

		<button type="submit" class="btn-login">
			ログイン
		</button>

		<p>
			<a href="/forgot-password" th:href="@{/forgot-password}">パスワードを忘れた方はこちら</a>
		</p>

	</form>

</body>
</html>
```
